name: Daily Prices Fetch

# Three-schedule design — all runs are fully idempotent (backfill skips
# dates already in DB), so overlaps are safe and cost nothing.
#
# Run 1 — EARLY MORNING  (Sun–Thu 23:00 UTC = 4:30 AM IST Mon–Fri)
#   Catches bhavcopy published after MCX closes (11:30 PM IST prev night).
#   Runs after midnight IST so NSE/MCX settlement files are reliably live.
#
# Run 2 — MORNING (Tue–Sat 03:30 UTC = 9:00 AM IST)
#   Catches data published later that night or early next morning.
#   Tue recovers Mon, Wed recovers Tue, … Sat recovers Fri.
#   Mirrors the timing of daily_margin.yml (same 03:30 UTC window).
#
# Run 3 — WEEKEND SWEEP (Sat 05:00 UTC = 10:30 AM IST)
#   Full 14-day backfill — catches anything the weekday runs missed.
#   Runs AFTER the morning run so it benefits from the morning data too.
#
# workflow_dispatch — manual trigger for testing or forced backfill.

on:
  schedule:
    - cron: '45 18 * * 0-4'   # Late Night: 00:15 AM IST (catches Bhavcopy right after 11:30 PM close)
    - cron: '30 19 * * 0-4'   # Post-Midnight: 01:00 AM IST (secondary post-close catch)
    - cron: '30 23 * * 0-4'   # Early AM: 05:00 AM IST Mon–Fri (23:30 UTC Sun–Thu)
    - cron: '35 3 * * 2-6'    # Morning:  09:05 AM IST Tue–Sat (staggered from margin fetch)
    - cron: '0 5 * * 6'       # Weekend: 10:30 AM IST Saturday (14-day sweep)
  workflow_dispatch:

concurrency:
  group: git-repo-sync
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    permissions:
      contents: write
      actions: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          python -m playwright install chromium
          python -m playwright install-deps chromium

      # ── Step 1: backfill last 14 days ──────────────────────────────────────
      # Covers today + the past 2 weeks.  On weekday night/morning runs this
      # is fast (only 1–2 new dates to fetch; the rest are already in DB).
      # On the Saturday sweep it ensures the whole week is complete.
      # EXIT 0 = at least one new date saved.  EXIT 1 = nothing new (clean skip).
      - name: Backfill last 14 days
        id: backfill
        run: |
          SINCE=$(date -d '16 days ago' +%Y-%m-%d)
          python scripts/fetch_prices.py backfill "$SINCE"
        continue-on-error: true

      - name: Export dashboard JSON
        run: python scripts/export_json.py

      - name: Update Deep LOD Daily Pyramid
        run: python scripts/build_lod_pyramid.py --incremental

      # ── Step 2: commit prices DB ────────────────────────────────────────────
      - name: Commit and push prices DB
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add data/prices.db docs/data/
          git diff --staged --quiet || git commit -m "data: price update $(date +%Y-%m-%d-%H%M)"
          git stash --include-untracked
          git pull --rebase origin main
          git stash pop || true
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ── Step 3: Relay Intraday Market Snapshot ──────────────────────────
      # Ensures the intraday live loop is running during MCX market hours.
      - name: Relay Intraday Market Snapshot
        run: |
          python -c "
          from datetime import datetime, timezone, timedelta
          import subprocess, json
          now_ist = datetime.now(timezone(timedelta(hours=5, minutes=30)))
          is_weekday = now_ist.weekday() < 5
          total_mins = now_ist.hour * 60 + now_ist.minute
          # If it is a weekday between 08:50 AM and 23:30 IST
          if is_weekday and (8 * 60 + 50 <= total_mins <= 23 * 60 + 55):
              check_res = subprocess.run(['gh', 'run', 'list', '--workflow=intraday_snapshot.yml', '--status', 'in_progress', '--json', 'databaseId'], capture_output=True, text=True)
              active = False
              if check_res.returncode == 0:
                  try:
                      active = len(json.loads(check_res.stdout)) > 0
                  except Exception:
                      pass
              if not active:
                  check_q = subprocess.run(['gh', 'run', 'list', '--workflow=intraday_snapshot.yml', '--status', 'queued', '--json', 'databaseId'], capture_output=True, text=True)
                  queued = False
                  if check_q.returncode == 0:
                      try:
                          queued = len(json.loads(check_q.stdout)) > 0
                      except Exception:
                          pass
                  if not queued:
                      print(f'[{now_ist.strftime(\"%Y-%m-%d %H:%M:%S IST\")}] Price fetch relay: waking up intraday market snapshot...')
                      subprocess.run(['gh', 'workflow', 'run', 'intraday_snapshot.yml'], capture_output=True, text=True)
                  else:
                      print('Intraday snapshot runner is already queued.')
              else:
                  print('Intraday snapshot runner is already actively running.')
          "
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
