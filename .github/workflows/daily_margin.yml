name: Daily Margin Fetch

on:
  schedule:
    # Run 1: MORNING (Mon–Fri 03:20 UTC = 08:50 AM IST) - 10 min before market open
    - cron: '20 3 * * 1-5'
    # Run 2: POST-OPEN (Mon–Fri 03:45 UTC = 09:15 AM IST) - in case MCX publishes at bell
    - cron: '45 3 * * 1-5'
    # Run 3: MID-MORNING (Mon–Fri 04:15 UTC = 09:45 AM IST) - backup for delayed publication
    - cron: '15 4 * * 1-5'
    # Run 4: LATE MORNING (Mon–Fri 06:00 UTC = 11:30 AM IST) - secondary safety net
    - cron: '0 6 * * 1-5'
    # Run 5: NOON (Mon–Fri 07:00 UTC = 12:30 PM IST)
    - cron: '0 7 * * 1-5'
    # Run 6: EARLY AFTERNOON (Mon–Fri 08:00 UTC = 13:30 PM IST)
    - cron: '0 8 * * 1-5'
    # Run 7: MID-AFTERNOON (Mon–Fri 09:30 UTC = 15:00 PM IST)
    - cron: '30 9 * * 1-5'
    # Run 8: EVENING (Mon–Fri 12:00 UTC = 17:30 PM IST)
    - cron: '0 12 * * 1-5'
    # Run 9: WEEKEND SWEEP (Sat 05:00 UTC = 10:30 AM IST) - late Friday sweep
    - cron: '0 5 * * 6'
    
  workflow_dispatch:

concurrency:
  group: git-repo-sync
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    permissions:
      contents: write
      actions: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          python -m playwright install chromium
          python -m playwright install-deps chromium

      # ── Step 1: Lookback gap-fill (last 5 weekdays) ──────────────────────
      # We run this FIRST so that any missed data from yesterday/past week 
      # is committed immediately, even if today's fetch takes a long time.
      - name: Lookback gap-fill (last 5 weekdays)
        id: lookback
        shell: bash
        run: |
          python scripts/lookback.py --days 5
          exit_code=$?
          if [ $exit_code -eq 0 ]; then
            echo "fresh_data=true" >> "$GITHUB_OUTPUT"
            exit 0
          elif [ $exit_code -eq 2 ]; then
            echo "fresh_data=false" >> "$GITHUB_OUTPUT"
            exit 0
          else
            exit $exit_code
          fi
        continue-on-error: true

      # ── Step 2: Fetch today's data ──────────────────────────────────────
      # Target today's date with retry logic.
      # fetch_today.py now includes a fail-fast weekend check.
      - name: Fetch today's margin data
        id: fetch_today
        shell: bash
        run: |
          python scripts/fetch_today.py --retries 1 --wait 0
          exit_code=$?
          if [ $exit_code -eq 0 ]; then
            echo "fresh_data=true" >> "$GITHUB_OUTPUT"
            exit 0
          elif [ $exit_code -eq 2 ]; then
            echo "fresh_data=false" >> "$GITHUB_OUTPUT"
            exit 0
          else
            exit $exit_code
          fi
        continue-on-error: true

      # ── Step 3: export ──────────────────────────────────────────────────
      # Regenerate JSON if either fetch step succeeded or if manual trigger.
      - name: Export dashboard JSON
        run: python scripts/export_json.py

      # ── Step 4: alert ───────────────────────────────────────────────────
      # Only alert if genuinely fresh today's data or backfill was found.
      - name: Check margin change and send alert
        if: steps.fetch_today.outputs.fresh_data == 'true' || steps.lookback.outputs.fresh_data == 'true' || github.event_name == 'workflow_dispatch'
        env:
          ALERT_EMAIL_PASSWORD: ${{ secrets.ALERT_EMAIL_PASSWORD }}
        run: python scripts/alert.py

      # ── Step 5: commit ──────────────────────────────────────────────────
      - name: Commit and push DB + dashboard data
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add data/ docs/data/
          git diff --staged --quiet || git commit -m "data: margin update $(date +%Y-%m-%d)"
          git stash --include-untracked
          git pull --rebase origin main
          git stash pop || true
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ── Step 6: Relay Intraday Market Snapshot ──────────────────────────
      # Ensures the intraday live loop is running during MCX market hours.
      - name: Relay Intraday Market Snapshot
        run: |
          python -c "
          from datetime import datetime, timezone, timedelta
          import subprocess, json
          now_ist = datetime.now(timezone(timedelta(hours=5, minutes=30)))
          is_weekday = now_ist.weekday() < 5
          total_mins = now_ist.hour * 60 + now_ist.minute
          # If it is a weekday between 08:50 AM and 23:30 IST
          if is_weekday and (8 * 60 + 50 <= total_mins <= 23 * 60 + 55):
              check_res = subprocess.run(['gh', 'run', 'list', '--workflow=intraday_snapshot.yml', '--status', 'in_progress', '--json', 'databaseId'], capture_output=True, text=True)
              active = False
              if check_res.returncode == 0:
                  try:
                      active = len(json.loads(check_res.stdout)) > 0
                  except Exception:
                      pass
              if not active:
                  check_q = subprocess.run(['gh', 'run', 'list', '--workflow=intraday_snapshot.yml', '--status', 'queued', '--json', 'databaseId'], capture_output=True, text=True)
                  queued = False
                  if check_q.returncode == 0:
                      try:
                          queued = len(json.loads(check_q.stdout)) > 0
                      except Exception:
                          pass
                  if not queued:
                      print(f'[{now_ist.strftime(\"%Y-%m-%d %H:%M:%S IST\")}] Margin fetch relay: waking up intraday market snapshot...')
                      subprocess.run(['gh', 'workflow', 'run', 'intraday_snapshot.yml'], capture_output=True, text=True)
                  else:
                      print('Intraday snapshot runner is already queued.')
              else:
                  print('Intraday snapshot runner is already actively running.')
          "
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
