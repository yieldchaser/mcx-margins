name: Daily Margin Fetch

on:
  schedule:
    # Run 1: MORNING (Mon–Fri 03:30 UTC = 09:00 AM IST)
    # Primary run to catch margins before market open.
    - cron: '30 3 * * 1-5'
    
    # Run 2: LATE MORNING (Mon–Fri 06:00 UTC = 11:30 AM IST)
    # Secondary safety net in case MCX publishes late.
    - cron: '0 6 * * 1-5'

    # Run 3: WEEKEND SWEEP (Sat 05:00 UTC = 10:30 AM IST)
    # Final check to ensure any late-Friday margins are captured.
    - cron: '0 5 * * 6'
    
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          python -m playwright install chromium
          python -m playwright install-deps chromium

      # ── Step 1: Lookback gap-fill (last 5 weekdays) ──────────────────────
      # We run this FIRST so that any missed data from yesterday/past week 
      # is committed immediately, even if today's fetch takes a long time.
      - name: Lookback gap-fill (last 5 weekdays)
        id: lookback
        shell: bash
        run: |
          python scripts/lookback.py --days 5
          exit_code=$?
          if [ $exit_code -eq 0 ] || [ $exit_code -eq 2 ]; then
            exit 0
          else
            exit $exit_code
          fi
        continue-on-error: true

      # ── Step 2: Fetch today's data ──────────────────────────────────────
      # Target today's date with retry logic.
      # fetch_today.py now includes a fail-fast weekend check.
      - name: Fetch today's margin data
        id: fetch_today
        shell: bash
        run: |
          python scripts/fetch_today.py --retries 1 --wait 0
          exit_code=$?
          if [ $exit_code -eq 0 ]; then
            echo "fresh_data=true" >> "$GITHUB_OUTPUT"
            exit 0
          elif [ $exit_code -eq 2 ]; then
            echo "fresh_data=false" >> "$GITHUB_OUTPUT"
            exit 0
          else
            exit $exit_code
          fi
        continue-on-error: true

      # ── Step 3: export ──────────────────────────────────────────────────
      # Regenerate JSON if either fetch step succeeded or if manual trigger.
      - name: Export dashboard JSON
        run: python scripts/export_json.py

      # ── Step 4: alert ───────────────────────────────────────────────────
      # Only alert if genuinely fresh today's data was found.
      - name: Check margin change and send alert
        if: steps.fetch_today.outputs.fresh_data == 'true'
        env:
          ALERT_EMAIL_PASSWORD: ${{ secrets.ALERT_EMAIL_PASSWORD }}
        run: python scripts/alert.py

      # ── Step 5: commit ──────────────────────────────────────────────────
      - name: Commit and push DB + dashboard data
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add data/ docs/data/
          git diff --staged --quiet || git commit -m "data: margin update $(date +%Y-%m-%d)"
          git stash --include-untracked
          git pull --rebase origin main
          git stash pop || true
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
