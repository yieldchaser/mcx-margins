name: Intraday Market Snapshot

# Runs every 15-20 minutes during MCX Trading Hours (09:00 to 23:30 IST = 03:30 to 18:00 UTC Mon-Fri)
# Pulls latest 1-minute execution candles from FYERS API in the cloud,
# updates deep LOD tiers (1m, 15m, daily), and synchronizes with GitHub Pages.

on:
  schedule:
    # High-Reliability Staggered Schedule (Mon–Fri during MCX hours 09:00 to 23:30 IST = 03:30 to 18:00 UTC)
    # 1. Pre-market wake-up & warm-up safety nets (Mon–Fri 03:00, 03:15, 03:26 UTC = 08:30, 08:45, 08:56 AM IST).
    - cron: '0 3 * * 1-5'
    - cron: '15 3 * * 1-5'
    - cron: '26 3 * * 1-5'
    # 2. Market-open safety nets (03:33, 03:41, 03:51 UTC = 09:03, 09:11, 09:21 AM IST).
    - cron: '33 3 * * 1-5'
    - cron: '41 3 * * 1-5'
    - cron: '51 3 * * 1-5'
    # 3. Dense intraday heartbeat (every 15 minutes from 04:00 to 17:45 UTC = 09:30 AM to 11:15 PM IST).
    - cron: '*/15 4-17 * * 1-5'
    # 4. Market close final session sweep (18:05 UTC = 23:35 PM IST).
    - cron: '5 18 * * 1-5'
  repository_dispatch:
    types: [intraday_sync]
  workflow_dispatch:

concurrency:
  group: intraday-market-sync
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      FYERS_ACCESS_TOKEN: ${{ secrets.FYERS_ACCESS_TOKEN }}
      FYERS_FY_ID: ${{ secrets.FYERS_FY_ID }}
      FYERS_PIN: ${{ secrets.FYERS_PIN }}
      FYERS_TOTP_KEY: ${{ secrets.FYERS_TOTP_KEY }}
    permissions:
      contents: write
      actions: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pyarrow duckdb fyers-apiv3 scipy pyotp

      - name: Check Fyers Token Availability
        id: check_token
        run: |
          if [ -z "$FYERS_ACCESS_TOKEN" ] && [ -z "$FYERS_TOTP_KEY" ]; then
            echo "Neither FYERS_ACCESS_TOKEN nor FYERS_TOTP_KEY secret is set. Skipping cloud intraday snapshot."
            echo "token_present=false" >> $GITHUB_OUTPUT
            exit 0
          else
            echo "token_present=true" >> $GITHUB_OUTPUT
          fi

      - name: Run Intraday Market Snapshot & LOD Sync
        if: steps.check_token.outputs.token_present == 'true'
        run: |
          python scripts/auto_market_snapshot.py --loop 600 --iterations 2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Chain Next Continuous Market Run
        if: always() && steps.check_token.outputs.token_present == 'true'
        run: |
          python -c "
          import sys
          import json
          from datetime import datetime, timezone, timedelta
          import subprocess
          
          now_ist = datetime.now(timezone(timedelta(hours=5, minutes=30)))
          is_weekday = now_ist.weekday() < 5
          total_mins = now_ist.hour * 60 + now_ist.minute
          # Market trading hours: Mon-Fri 08:50 to 23:55 IST (covers 08:50 pre-market standby + Summer 23:30 and Winter 23:55)
          is_market_open = is_weekday and (8 * 60 + 50 <= total_mins <= 23 * 60 + 55)
          
          if is_market_open:
              has_pending = False
              try:
                  check_res = subprocess.run(['gh', 'run', 'list', '--workflow=intraday_snapshot.yml', '--status', 'queued', '--json', 'databaseId'], capture_output=True, text=True)
                  if check_res.returncode == 0:
                      queued_runs = json.loads(check_res.stdout)
                      if len(queued_runs) > 0:
                          has_pending = True
              except Exception as e:
                  print('Notice checking queued runs:', e)

              if has_pending:
                  print(f'[{now_ist.strftime(\"%Y-%m-%d %H:%M:%S IST\")}] Successor run already queued. Clean handoff.')
              else:
                  print(f'[{now_ist.strftime(\"%Y-%m-%d %H:%M:%S IST\")}] Market is OPEN. Dispatching continuous chain runner...')
                  res = subprocess.run(['gh', 'workflow', 'run', 'intraday_snapshot.yml'], capture_output=True, text=True)
                  print(res.stdout)
                  if res.returncode != 0:
                      print('Notice dispatching next chain:', res.stderr)
          else:
              print(f'[{now_ist.strftime(\"%Y-%m-%d %H:%M:%S IST\")}] Market is CLOSED.')
              # Determine if an upcoming trading session needs the Overnight Sentinel bridge:
              # 1. Mon-Fri early morning before market open (00:00 to 08:55 IST)
              # 2. Mon-Thu night after market close (>= 23:25 IST) bridging to next morning
              # 3. Sunday evening/night (>= 12:00 IST) bridging to Monday morning
              needs_sentinel = (
                  (is_weekday and total_mins < 8 * 60 + 50) or
                  (now_ist.weekday() in (0, 1, 2, 3) and total_mins >= 23 * 60 + 25) or
                  (now_ist.weekday() == 6 and total_mins >= 12 * 60)
              )
              if needs_sentinel:
                  print(f'[{now_ist.strftime(\"%Y-%m-%d %H:%M:%S IST\")}] Igniting Overnight Bridge Sentinel for next morning 08:55 AM IST...')
                  subprocess.run(['gh', 'workflow', 'run', 'market_sentinel.yml'], capture_output=True, text=True)
              else:
                  print('Weekend session closed. Sentinel standing by.')
          "
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
