name: Intraday Market Snapshot

# Runs every 30 minutes during MCX Trading Hours (09:00 to 23:30 IST = 03:30 to 18:00 UTC Mon-Fri)
# Pulls latest 1-minute execution candles from FYERS API in the cloud,
# updates deep LOD tiers (1m, 15m, daily), and synchronizes with GitHub Pages.

on:
  schedule:
    # Triggered every 20 minutes during MCX Trading Hours (09:00 to 23:30 IST = 03:30 to 18:00 UTC Mon-Fri)
    # Morning market open trigger (Mon–Fri 03:30 UTC = 09:00 AM IST)
    - cron: '30 3 * * 1-5'
    # Safety net heartbeat during MCX trading hours
    - cron: '*/30 4-18 * * 1-5'
  repository_dispatch:
    types: [intraday_sync]
  workflow_dispatch:

concurrency:
  group: intraday-market-sync
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      FYERS_ACCESS_TOKEN: ${{ secrets.FYERS_ACCESS_TOKEN }}
      FYERS_FY_ID: ${{ secrets.FYERS_FY_ID }}
      FYERS_PIN: ${{ secrets.FYERS_PIN }}
      FYERS_TOTP_KEY: ${{ secrets.FYERS_TOTP_KEY }}
    permissions:
      contents: write
      actions: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pyarrow duckdb fyers-apiv3 scipy pyotp

      - name: Check Fyers Token Availability
        id: check_token
        run: |
          if [ -z "$FYERS_ACCESS_TOKEN" ] && [ -z "$FYERS_TOTP_KEY" ]; then
            echo "Neither FYERS_ACCESS_TOKEN nor FYERS_TOTP_KEY secret is set. Skipping cloud intraday snapshot."
            echo "token_present=false" >> $GITHUB_OUTPUT
            exit 0
          else
            echo "token_present=true" >> $GITHUB_OUTPUT
          fi

      - name: Run Intraday Market Snapshot & LOD Sync
        if: steps.check_token.outputs.token_present == 'true'
        run: |
          python scripts/auto_market_snapshot.py --loop 600 --iterations 2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Chain Next Continuous Market Run
        if: steps.check_token.outputs.token_present == 'true'
        run: |
          python -c "
          import sys
          from datetime import datetime, timezone, timedelta
          import subprocess
          
          now_ist = datetime.now(timezone(timedelta(hours=5, minutes=30)))
          is_weekday = now_ist.weekday() < 5
          total_mins = now_ist.hour * 60 + now_ist.minute
          # Market trading hours: Mon-Fri 09:00 to 23:30 IST
          is_market_open = is_weekday and (9 * 60 <= total_mins < 23 * 60 + 30)
          
          if is_market_open:
              print(f'[{now_ist.strftime(\"%Y-%m-%d %H:%M:%S IST\")}] Market is OPEN. Dispatching continuous chain runner...')
              res = subprocess.run(['gh', 'workflow', 'run', 'intraday_snapshot.yml'], capture_output=True, text=True)
              print(res.stdout)
              if res.returncode != 0:
                  print('Notice dispatching next chain:', res.stderr)
          else:
              print(f'[{now_ist.strftime(\"%Y-%m-%d %H:%M:%S IST\")}] Market is CLOSED. Ending continuous runner loop for the day.')
          "
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
